<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />

<title>测一测，你在异世界的 隐藏天赋是什么？</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0B0E1A;
    --card:#151A2E;
    --accent:#E8B86D;
    --accent-dim:#8A6A3B;
    --text:#F2EDE4;
    --text-dim:#A9A39A;
    --line:#E8B86D33;
    --title-font:"Songti SC","STSong","Noto Serif SC",serif;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, #E8B86D2e, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, #E8B86D16, transparent 70%);
  }
  .app{
    position:relative;z-index:1;
    max-width:520px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 40px);
  }
  /* 屏切换：display 只由 .screen/.screen.active 控制，任何内容类不得碰 display */
  .screen{display:none;}
  .screen.active{display:block;animation:fadeUp .5s cubic-bezier(.22,.9,.3,1);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  /* ---------- 封面 ---------- */
  .cover{padding-top:52px;text-align:center;}
  .cover-eyebrow{font-size:11px;letter-spacing:5px;color:var(--accent-dim);margin-bottom:30px;font-weight:500;}
  .cover-title{
    font-family:var(--title-font);
    font-size:29px;line-height:1.55;font-weight:600;letter-spacing:1px;
    color:var(--accent);
  }
  .cover-sub{margin-top:26px;font-size:14px;line-height:2;color:var(--text-dim);}
  .cover-quote{
    margin:24px auto 0;max-width:88%;
    font-family:var(--title-font);
    font-size:15px;line-height:2;color:var(--text);
    border-left:2px solid var(--accent-dim);border-right:2px solid var(--accent-dim);
    padding:6px 14px;
  }
  .cover-meta{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:30px;font-size:12px;color:var(--accent-dim);}
  .cover-meta i{width:3px;height:3px;border-radius:50%;background:var(--accent-dim);opacity:.6;}
  .btn-primary{
    display:block;width:100%;margin-top:38px;
    padding:17px 0;border:none;border-radius:999px;
    background:var(--accent);color:var(--btn-ink,#231c0d);
    font-size:16px;font-weight:700;letter-spacing:3px;font-family:inherit;
    box-shadow:0 10px 30px -10px #E8B86D99;
    transition:transform .18s ease;
  }
  .btn-primary:active{transform:scale(.975);}
  .cover-note{margin-top:20px;font-size:11px;line-height:1.9;color:var(--text-dim);opacity:.75;}

  /* ---------- 答题 ---------- */
  .progress{height:3px;border-radius:3px;background:#ffffff12;overflow:hidden;}
  .progress-bar{height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .4s cubic-bezier(.22,.9,.3,1);}
  .q-index{margin-top:12px;font-size:12px;color:var(--accent-dim);letter-spacing:2px;font-variant-numeric:tabular-nums;}
  .q-text{
    font-family:var(--title-font);
    font-size:20px;line-height:1.72;font-weight:600;
    margin:24px 0 26px;letter-spacing:.4px;
  }
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    font-family:inherit;background:var(--card);
    border:1px solid var(--line);color:var(--text);
    padding:16px;border-radius:15px;font-size:15px;line-height:1.65;
    transition:transform .16s ease,border-color .2s ease,background .2s ease;
  }
  .opt:active{transform:scale(.98);}
  .opt.selected{border-color:var(--accent);background:#E8B86D26;box-shadow:0 0 0 1px var(--accent) inset;}
  .opt-idx{
    flex:0 0 21px;height:21px;border-radius:50%;margin-top:3px;
    border:1px solid var(--accent-dim);color:var(--accent);
    font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;
  }
  .opt.selected .opt-idx{background:var(--accent);color:var(--btn-ink,#231c0d);border-color:var(--accent);}
  .opt-text{flex:1;}
  .fade-in{animation:fadeUp .38s cubic-bezier(.22,.9,.3,1);}

  /* ---------- 结果 ---------- */
  .res-top{text-align:center;padding:20px 0 4px;}
  .res-eyebrow{font-size:11px;letter-spacing:4px;color:var(--accent-dim);margin-bottom:18px;}
  .res-score{
    font-family:var(--title-font);
    font-size:62px;font-weight:700;line-height:1;letter-spacing:-2px;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .res-score em{font-size:24px;font-style:normal;margin-left:2px;}
  .res-score-label{font-size:11px;letter-spacing:4px;color:var(--accent-dim);margin-top:6px;}
  .res-name{font-family:var(--title-font);font-size:31px;font-weight:600;letter-spacing:5px;margin:22px 0 8px;}
  .res-role{font-size:12.5px;color:var(--text-dim);letter-spacing:.6px;}
  .res-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .res-tags span{font-size:12px;padding:4px 13px;border-radius:999px;border:1px solid var(--line);color:var(--accent);background:#E8B86D14;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:14px;}
  .card-label{font-size:10.5px;letter-spacing:3px;color:var(--accent-dim);margin-bottom:12px;font-weight:600;}
  .hr{height:1px;background:var(--line);margin:18px 0;}
  .voice{
    font-family:var(--title-font);font-size:16.5px;line-height:1.85;
    border-left:2px solid var(--accent-dim);padding-left:14px;letter-spacing:.5px;
  }
  .bars{display:flex;flex-direction:column;gap:11px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-name{flex:0 0 34px;font-size:12.5px;color:var(--text-dim);letter-spacing:1px;}
  .bar-name.lead{color:var(--accent);font-weight:700;}
  .bar-track{flex:1;height:7px;border-radius:7px;background:#ffffff12;overflow:hidden;}
  .bar-fill{display:block;height:100%;width:0;border-radius:7px;background:var(--accent-dim);transition:width .9s cubic-bezier(.22,.9,.3,1);}
  .bar-fill.lead{background:var(--accent);}
  .bar-val{flex:0 0 26px;text-align:right;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .bar-val.lead{color:var(--accent);font-weight:700;}
  .explain{font-size:14.5px;line-height:2.05;color:var(--text);letter-spacing:.3px;text-align:justify;}
  .explain b{color:var(--accent);font-weight:600;}
  .disclaimer{
    margin-top:18px;padding:14px 16px;border-radius:12px;
    background:#E8B86D14;border:1px dashed var(--line);
    font-size:11.5px;line-height:1.9;color:var(--text-dim);text-align:center;
  }
  .btn-ghost{
    display:block;width:100%;margin-top:22px;padding:15px 0;border-radius:999px;
    background:transparent;border:1px solid var(--line);color:var(--accent);
    font-size:14px;letter-spacing:2px;font-family:inherit;
    transition:background .2s ease,transform .16s ease;
  }
  .btn-ghost:active{background:#E8B86D14;transform:scale(.98);}
  .foot-mark{text-align:center;font-size:10.5px;color:var(--text-dim);letter-spacing:2px;margin-top:26px;opacity:.6;}
</style>
</head>

var QUESTIONS=[{"text": "你在异世界集市发现一只发光沙漏，它无人看管，但触碰可能唤醒封印。你会？", "options": [{"t": "轻轻碰一下，感受它的温度与心跳", "s": {"ling": 3, "xing": 1, "zhu": 1}}, {"t": "蹲下来观察上面流动的符文结构", "s": {"yan": 3, "shou": 2, "ling": 1}}, {"t": "直接把它倒转，看时间倒流的后果", "s": {"po": 3, "ying": 2, "wang": 1}}]}, {"text": "你的异世界同伴被贵族诬陷偷窃，你知道真相但说出会暴露同伴的逃亡身份。你会？", "options": [{"t": "当众说出真相，哪怕同伴必须再次逃亡", "s": {"po": 3, "yan": 2, "shou": 1}}, {"t": "沉默，事后帮同伴策划更安全的离开", "s": {"ying": 3, "ling": 2, "wang": 1}}, {"t": "用伪造的证据让贵族自己露出破绽", "s": {"yan": 2, "shou": 3, "zhu": 1}}]}, {"text": "你在废墟里捡到一本会低语未来的书，但每读一页就会忘掉一段过去的记忆。你会？", "options": [{"t": "只读最后一页，直接知道结局", "s": {"xing": 3, "po": 2, "wang": 1}}, {"t": "一页一页读，用记忆换完整预知", "s": {"ling": 3, "yan": 2, "xing": 1}}, {"t": "把书合上，用现在去赌未来", "s": {"shou": 3, "zhu": 2, "po": 1}}]}, {"text": "城门口的守卫是你旧友，他求你放行一队被通缉的难民，但你会因此被革职。你会？", "options": [{"t": "放行，革职后跟着难民一起走", "s": {"po": 3, "ling": 2, "ying": 1}}, {"t": "拒绝，但连夜帮难民找另一条路", "s": {"shou": 3, "zhu": 2, "ying": 1}}, {"t": "让旧友自己决定，你假装没看见", "s": {"ying": 3, "wang": 2, "yan": 1}}]}, {"text": "你在异世界醒来，发现自己能听见植物说话，但每听一次就会失去一段人类语言。你会？", "options": [{"t": "继续听，用人类语言换万物的秘密", "s": {"ling": 3, "wang": 2, "yan": 1}}, {"t": "只和一棵老树保持对话，控制代价", "s": {"shou": 3, "zhu": 2, "ling": 1}}, {"t": "教植物说人类语言，双向交换", "s": {"yan": 3, "xing": 2, "po": 1}}]}, {"text": "你的影子在满月夜活了过来，它说可以替你承受一次致命伤，但之后要带走你一半寿命。你会？", "options": [{"t": "答应，把影子当作战友而非工具", "s": {"ying": 3, "wang": 2, "po": 1}}, {"t": "拒绝，用锻炼和策略避免致命伤", "s": {"shou": 3, "zhu": 2, "xing": 1}}, {"t": "和影子谈判，用其他代价替代寿命", "s": {"yan": 3, "ling": 2, "ying": 1}}]}, {"text": "你发现异世界的魔力来自一颗被囚禁的星辰，释放它会引发大陆魔力潮汐。你会？", "options": [{"t": "释放它，让魔力重新自由流淌", "s": {"po": 3, "xing": 2, "ling": 1}}, {"t": "维持囚禁，但定期去和它说话", "s": {"shou": 3, "wang": 2, "yan": 1}}, {"t": "寻找第三种方式，让星辰自愿留下", "s": {"xing": 3, "zhu": 2, "ling": 1}}]}, {"text": "你的导师临终前把禁忌咒语传给你，叮嘱只有大陆毁灭时才能使用。当晚你就预见了毁灭。你会？", "options": [{"t": "立刻使用，哪怕被所有人误解", "s": {"po": 3, "yan": 2, "wang": 1}}, {"t": "先验证预言，找到更温和的解法", "s": {"shou": 3, "ling": 2, "zhu": 1}}, {" function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function pearson(a,b){
  var n=a.length,ma=0,mb=0,i;
  for(i=0;i<n;i++){ma+=a[i];mb+=b[i];}
  ma/=n;mb/=n;
  var num=0,da=0,db=0;
  for(i=0;i<n;i++){var x=a[i]-ma,y=b[i]-mb;num+=x*y;da+=x*x;db+=y*y;}
  var den=Math.sqrt(da*db);
  return den<1e-6?0:num/den;
}
function calcScores(picks){
  var raw={},maxp={};
  DIMS.forEach(function(d){raw[d.key]=0;maxp[d.key]=0;});
  picks.forEach(function(optIdx,qi){
    var s=QUESTIONS[qi].options[optIdx].s;
    for(var k in s)raw[k]+=s[k];
  });
  QUESTIONS.forEach(function(q){
    var per={};
    DIMS.forEach(function(d){per[d.key]=0;});
    q.options.forEach(function(o){
      for(var k in o.s)per[k]=Math.max(per[k],o.s[k]);
    });
    DIMS.forEach(function(d){maxp[d.key]+=per[d.key];});
  });
  var scores={};
  DIMS.forEach(function(d){
    var m=maxp[d.key]||1;
    var ratio=Math.min(1,raw[d.key]/m);
    scores[d.key]=Math.max(18,Math.min(99,Math.round(25+ratio*74)));
  });
  return scores;
}
function findMatch(scores){
  var uv=DIMS.map(function(d){return scores[d.key];});
  var best=null,bc=-2;
  FIGURES.forEach(function(f){
    var fv=DIMS.map(function(d){return (f.v&&f.v[d.key])||0;});
    var c=pearson(uv,fv);
    if(c>bc){bc=c;best=f;}
  });
  var pct=Math.round(Math.max(86,Math.min(97,90+bc*7)));
  return {fig:best,pct:pct};
}
function buildExplain(scores,fig){
  var sorted=DIMS.slice().sort(function(a,b){return scores[b.key]-scores[a.key];});
  var d1=sorted[0],d2=sorted[1],d3=sorted[2];
  var head='你的八维倾向里，<b>「'+d1.name+'」'+scores[d1.key]+' 分</b>、<b>「'+d2.name+'」'+scores[d2.key]+' 分</b>最突出，'
    +'「'+d3.name+'」'+scores[d3.key]+' 分紧随其后。在那些必须做取舍的时刻，你的第一反应往往是'+d1.name+'，'
    +'第二步才用'+d2.name+'去收尾。';
  return head+'<br><br>'+fig.match;
}

  var barsHTML=DIMS.map(function(d){

  var tagsHTML=(fig.tags||[]).map(function(t){return '<span>'+t+'</span>';}).join('');
  return '<div class="res-top">'
    +'<p class="res-eyebrow">匹 配 结 果</p>'
    +'<div class="res-score">'+pct+'<em>%</em></div>'
    +'<div class="res-score-label">匹 配 度</div>'
    +'<h2 class="res-name">'+fig.name+'</h2>'
    +'<p class="res-role">'+(fig.era||'')+' · '+(fig.role||'')+'</p>'
    +'<div class="res-tags">'+tagsHTML+'</div></div>'
    +'<div class="card"><div class="card-label">心 声</div>'
    +'<blockquote class="voice">「'+fig.voice+'」</blockquote></div>'
    +'<div class="card"><div class="card-label">八 维 倾 向</div><div class="bars">'+barsHTML+'</div></div>'
    +'<div class="card"><div class="card-label">为 什 么 是 T A</div>'
    +'<p class="explain">'+buildExplain(scores,fig)+'</p></div>'
    +'<div class="disclaimer">相近的是部分选择方式，<br>不代表经历、能力或价值相同。</div>'
    +'<button class="btn-ghost" id="restartBtn">重 新 测 一 次</button>'
    +'<p class="foot-mark">异世界天赋</p>';
}
function animateBars(){
  var fills=document.querySelectorAll('.bar-fill');
  fills.forEach(function(el){el.style.width='0%';});
  requestAnimationFrame(function(){
    setTimeout(function(){
      fills.forEach(function(el){el.style.width=el.getAttribute('data-w')+'%';});
    },80);
  });
}
var current=0,picks=[],locked=false;
function renderQuestion(){
  var q=QUESTIONS[current];
  document.getElementById('qIndex').textContent=current+1;
  document.getElementById('qTotal').textContent=QUESTIONS.length;
  document.getElementById('progressBar').style.width=(current/QUESTIONS.length*100)+'%';
  var body=document.getElementById('qBody');
  body.innerHTML='<h2 class="q-text">'+q.text+'</h2><div class="opts" id="opts"></div>';
  body.classList.remove('fade-in');void body.offsetWidth;body.classList.add('fade-in');
  var wrap=document.getElementById('opts');
  q.options.forEach(function(o,i){
    var btn=document.createElement('button');
    btn.type='button';btn.className='opt';
    btn.innerHTML='<span class="opt-idx">'+String.fromCharCode(65+i)+'</span><span class="opt-text">'+o.t+'</span>';
    btn.addEventListener('click',function(){choose(i,btn);});
    wrap.appendChild(btn);
  });
}
function choose(idx,btn){
  if(locked)return;
  locked=true;btn.classList.add('selected');picks[current]=idx;
  setTimeout(function(){
    locked=false;current++;
    if(current>=QUESTIONS.length)finish();else renderQuestion();
  },280);
}
function finish(){
  document.getElementById('progressBar').style.width='100%';
  var scores=calcScores(picks);
  var r=findMatch(scores);
  var res=document.getElementById('screen-result');
  res.innerHTML=buildResultHTML(r.fig,r.pct,scores);
  show('screen-result');
  animateBars();
  var rb=document.getElementById('restartBtn');
  if(rb)rb.addEventListener('click',function(){
    current=0;picks=[];locked=false;show('screen-cover');
  });
}
document.getElementById('startBtn').addEventListener('click',function(){
  current=0;picks=[];locked=false;
  document.getElementById('progressBar').style.width='0%';
  show('screen-quiz');renderQuestion();
});
var lastTouch=0;
document.addEventListener('touchend',function(e){
  var now=Date.now();
  if(now-lastTouch<=300)e.preventDefault();
  lastTouch=now;
},{passive:false});
</script>
</body>
</html>
