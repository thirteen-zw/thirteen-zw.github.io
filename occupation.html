<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c18">
<title>天赋能力测试测评报告 · 职业深度版</title>
<style>
  :root{
    --bg:#080c18;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --txt:#e9edf9;
    --sub:#8b96b4;
    --c1:#7dd3fc;
    --c2:#a78bfa;
    --c3:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--txt);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60% 40% at 15% 0%, rgba(124,58,237,.20), transparent 70%),
      radial-gradient(55% 38% at 90% 12%, rgba(14,165,233,.16), transparent 70%),
      radial-gradient(70% 45% at 50% 100%, rgba(251,191,36,.07), transparent 70%);
  }
  .app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- 封面 ---------- */
  #screen-cover.active{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    min-height:100vh;padding:48px 26px calc(48px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .cover-badge{
    font-size:12px;letter-spacing:.22em;color:var(--c1);
    border:1px solid rgba(125,211,252,.35);border-radius:999px;
    padding:6px 16px;margin-bottom:32px;
    background:rgba(125,211,252,.06);
  }
  .cover-title{
    font-size:clamp(24px,7.2vw,32px);
    font-weight:800;line-height:1.55;margin:0 0 22px;
    letter-spacing:.02em;
    background:linear-gradient(120deg,#ffffff 10%,#bcd8ff 55%,#c4b5fd 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cover-sub{
    font-size:13.5px;color:var(--sub);line-height:2;margin:0 0 46px;
  }
  .cover-sub b{color:#b9c4e0;font-weight:500;}
  .btn-main{
    appearance:none;border:none;
    width:100%;max-width:320px;
    padding:17px 24px;border-radius:16px;
    font-size:16px;font-weight:700;letter-spacing:.06em;
    color:#08101f;cursor:pointer;
    background:linear-gradient(120deg,#7dd3fc,#a78bfa 60%,#f0abfc);
    box-shadow:0 10px 34px -8px rgba(124,58,237,.65);
    transition:transform .18s ease, box-shadow .18s ease;
    font-family:inherit;
  }
  .btn-main:active{transform:scale(.965);box-shadow:0 6px 20px -8px rgba(124,58,237,.65);}
  .cover-foot{font-size:11.5px;color:#5b6787;margin-top:26px;letter-spacing:.08em;}

  /* ---------- 答题 ---------- */
  .quiz-top{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:12px;
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg,rgba(8,12,24,.96),rgba(8,12,24,.82));
    backdrop-filter:blur(14px);
  }
  .back-btn{
    appearance:none;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--txt);
    width:34px;height:34px;border-radius:11px;
    font-size:19px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding-bottom:3px;flex:0 0 auto;font-family:inherit;
  }
  .back-btn:disabled{opacity:.25;}
  .progress{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;}
  #progressFill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#7dd3fc,#a78bfa);
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  #progressText{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:36px;text-align:right;}

  .quiz-body{padding:26px 18px calc(60px + env(safe-area-inset-bottom));}
  .q-index{
    font-size:12px;letter-spacing:.2em;color:var(--c2);
    margin-bottom:10px;font-weight:600;
  }
  .q-title{
    font-size:19px;font-weight:700;line-height:1.65;
    margin:0 0 28px;letter-spacing:.01em;
    animation:fadeUp .4s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .options{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;align-items:center;gap:13px;
    width:100%;text-align:left;
    padding:17px 16px;border-radius:16px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    color:var(--txt);font-size:15px;line-height:1.55;
    cursor:pointer;font-family:inherit;
    transition:all .2s ease;
    animation:fadeUp .45s ease both;
  }
  .opt .dot{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;
    border:1.6px solid rgba(255,255,255,.28);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--sub);font-weight:700;
    transition:all .2s ease;
  }
  .opt:active{transform:scale(.978);}
  .opt.sel{
    border-color:rgba(167,139,250,.85);
    background:linear-gradient(120deg,rgba(125,211,252,.16),rgba(167,139,250,.20));
    box-shadow:0 0 0 3px rgba(167,139,250,.13);
  }
  .opt.sel .dot{
    border-color:transparent;
    background:linear-gradient(120deg,#7dd3fc,#a78bfa);
    color:#08101f;
  }

  /* ---------- 结果 ---------- */
  #screen-result{padding:calc(18px + env(safe-area-inset-top)) 0 calc(50px + env(safe-area-inset-bottom));}
  .res-head{
    text-align:center;padding:10px 22px 22px;
  }
  .res-head h1{
    font-size:clamp(19px,5.6vw,23px);line-height:1.7;font-weight:800;margin:0;
    background:linear-gradient(120deg,#fff,#bfd7ff 60%,#c4b5fd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .res-head p{font-size:12px;color:var(--sub);letter-spacing:.14em;margin:12px 0 0;}

  .card{
    margin:0 14px 15px;padding:22px 18px;
    border-radius:20px;
    border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(255,255,255,.062),rgba(255,255,255,.018));
    backdrop-filter:blur(8px);
    animation:fadeUp .5s ease both;
    box-shadow:0 8px 28px -20px rgba(0,0,0,.9);
  }
  .card-label{
    font-size:11px;letter-spacing:.2em;color:var(--c2);
    font-weight:700;margin-bottom:14px;
  }

  .type-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .type-name{
    font-size:26px;font-weight:800;letter-spacing:.01em;
    background:linear-gradient(120deg,#7dd3fc,#a78bfa 70%,#f0abfc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .type-pct{font-size:17px;font-weight:700;color:var(--c3);font-variant-numeric:tabular-nums;}
  .type-desc{font-size:13.5px;color:#aab5cf;margin:14px 0 22px;line-height:1.9;}
  .type-desc b{color:#e2e8fb;font-weight:600;}

  .bars{display:flex;flex-direction:column;gap:11px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{
    flex:0 0 84px;font-size:12px;color:var(--sub);
    white-space:nowrap;letter-spacing:.01em;
  }
  .bar-track{
    flex:1;height:7px;border-radius:99px;
    background:rgba(255,255,255,.075);overflow:hidden;
  }
  .bar-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,rgba(125,211,252,.75),rgba(167,139,250,.75));
    transition:width .85s cubic-bezier(.22,1,.36,1);
  }
  .bar-fill.hot{background:linear-gradient(90deg,#7dd3fc,#c084fc,#fbbf24);box-shadow:0 0 12px rgba(192,132,252,.55);}
  .bar-val{
    flex:0 0 22px;text-align:right;font-size:12.5px;
    color:#cdd6ee;font-variant-numeric:tabular-nums;font-weight:600;
  }

  .detail-list{display:flex;flex-direction:column;gap:1px;margin-bottom:18px;}
  .detail-row{
    display:flex;align-items:center;gap:10px;
    padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.055);
    font-size:14px;
  }
  .detail-row:last-child{border-bottom:none;}
  .detail-name{flex:1;color:#dfe6f8;}
  .detail-score{
    font-weight:700;font-variant-numeric:tabular-nums;
    color:#cdd6ee;min-width:24px;text-align:right;font-size:14.5px;
  }
  .detail-level{
    flex:0 0 auto;font-size:11.5px;padding:3px 10px;border-radius:99px;
    font-weight:600;letter-spacing:.02em;
  }
  .lv-a{background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.3);}
  .lv-b{background:rgba(125,211,252,.12);color:#7dd3fc;border:1px solid rgba(125,211,252,.28);}
  .lv-c{background:rgba(255,255,255,.05);color:#8b96b4;border:1px solid rgba(255,255,255,.09);}
  .lv-d{background:rgba(255,255,255,.03);color:#5b6787;border:1px solid rgba(255,255,255,.07);}

  .type-line{
    font-size:13.5px;color:#aab5cf;
    padding-top:14px;border-top:1px dashed rgba(255,255,255,.11);
  }
  .type-line b{color:#c4b5fd;font-weight:700;}

  .kv{
    display:flex;gap:12px;padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.055);
    font-size:13.5px;
  }
  .kv:last-of-type{border-bottom:none;}
  .kv span{flex:0 0 88px;color:var(--sub);}
  .kv b{color:#dfe6f8;font-weight:600;flex:1;}

  .first-talent{
    margin-top:16px;padding:18px 16px;border-radius:16px;
    background:linear-gradient(120deg,rgba(125,211,252,.12),rgba(167,139,250,.16));
    border:1px solid rgba(167,139,250,.3);
    text-align:center;
  }
  .ft-label{font-size:11px;letter-spacing:.24em;color:#c4b5fd;font-weight:700;margin-bottom:8px;}
  .ft-name{font-size:19px;font-weight:800;color:#fff;margin-bottom:6px;}
  .ft-level{font-size:12.5px;color:var(--c3);font-weight:600;}

  .lead{font-size:14px;color:#c8d2e8;margin:0 0 16px;line-height:1.95;}
  .sub-label{
    font-size:12px;color:var(--c1);font-weight:700;
    letter-spacing:.1em;margin:20px 0 10px;
  }
  .sub-label:first-of-type{margin-top:6px;}
  ul.tick{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
  ul.tick li{
    position:relative;padding-left:20px;
    font-size:13.5px;color:#b5c0da;line-height:1.75;
  }
  ul.tick li::before{
    content:'';position:absolute;left:2px;top:10px;
    width:6px;height:6px;border-radius:50%;
    background:linear-gradient(120deg,#7dd3fc,#a78bfa);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-size:12.5px;padding:7px 13px;border-radius:10px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);
    color:#c2cce4;
  }

  .career{
    padding:15px 0;border-bottom:1px solid rgba(255,255,255,.055);
  }
  .career:last-child{border-bottom:none;padding-bottom:4px;}
  .career-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .career-name{font-size:15.5px;font-weight:700;color:#eef2ff;}
  .career-pct{
    font-size:14px;font-weight:800;color:var(--c3);
    font-variant-numeric:tabular-nums;flex:0 0 auto;
  }
  .career-tag{
    display:inline-block;font-size:11px;color:#8fa6d8;
    margin:7px 0 6px;padding:2px 9px;border-radius:6px;
    background:rgba(125,211,252,.09);
    border:1px solid rgba(125,211,252,.18);
  }
  .career-desc{font-size:13px;color:#98a4c0;margin:0;line-height:1.8;}

  .caution{
    margin-top:18px;padding:15px 16px;border-radius:14px;
    background:rgba(251,191,36,.06);
    border:1px solid rgba(251,191,36,.2);
  }
  .caution-title{font-size:12px;color:#fcd34d;font-weight:700;letter-spacing:.1em;margin-bottom:8px;}
  .caution p{font-size:13px;color:#c3b98f;margin:0;line-height:1.85;}

  .voice{
    margin-top:18px;padding:18px 16px;border-radius:16px;
    background:linear-gradient(120deg,rgba(167,139,250,.13),rgba(125,211,252,.09));
    border:1px solid rgba(167,139,250,.26);
  }
  .voice-title{font-size:11px;letter-spacing:.22em;color:#c4b5fd;font-weight:700;margin-bottom:10px;}
  .voice p{font-size:14px;color:#dfe6f8;margin:0;line-height:1.9;font-style:italic;}

  .phase{
    position:relative;padding:0 0 4px 22px;
    border-left:1.5px solid rgba(255,255,255,.1);
    margin-bottom:22px;
  }
  .phase:last-child{margin-bottom:0;}
  .phase::before{
    content:'';position:absolute;left:-6px;top:5px;
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(120deg,#7dd3fc,#a78bfa);
    box-shadow:0 0 0 3px rgba(8,12,24,1);
  }
  .phase-title{font-size:14px;font-weight:700;color:#c4b5fd;margin-bottom:10px;}
  .phase ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  .phase li{
    font-size:13.5px;color:#b5c0da;line-height:1.75;
    padding-left:15px;position:relative;
  }
  .phase li::before{
    content:'·';position:absolute;left:3px;top:-2px;
    color:#7dd3fc;font-weight:700;font-size:17px;
  }

  .sim-box{
    margin-top:16px;padding:16px;border-radius:14px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
  }
  .sim-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:9px;}
  .sim-name em{font-style:normal;color:var(--c1);}
  .sim-text{font-size:13px;color:#a6b1cc;line-height:1.95;margin:0;text-align:justify;}

  .grow{
    margin-top:14px;font-size:13px;color:#8b96b4;
    padding:12px 14px;border-radius:12px;
    background:rgba(255,255,255,.03);
    border:1px dashed rgba(255,255,255,.11);
  }
  .grow b{color:#fcd34d;font-weight:700;}

  .reset-wrap{text-align:center;padding:16px 22px 0;}
  .btn-ghost{
    appearance:none;font-family:inherit;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    color:#aab5cf;font-size:14px;
    padding:13px 34px;border-radius:14px;cursor:pointer;
    transition:all .2s ease;
  }
  .btn-ghost:active{transform:scale(.96);background:rgba(255,255,255,.09);}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 封面 ============ -->
  <section id="screen-cover" class="screen active">
    <div class="cover-badge">多元智能理论 · 职业深度版</div>
    <h1 class="cover-title">去端你天生该吃的那碗饭<br>去闯你本就该走的那条路</h1>
    <p class="cover-sub">
      <b>天赋能力测试测评报告</b><br>
      10 个维度 · 12 道情境题 · 约 2 分钟
    </p>
    <button class="btn-main" id="startBtn">开始测试</button>
    <div class="cover-foot">请凭第一直觉作答 · 答案无对错</div>
  </section>

  <!-- ============ 答题 ============ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-top">
      <button class="back-btn" id="backBtn">‹</button>
      <div class="progress"><div id="progressFill"></div></div>
      <span id="progressText">1/12</span>
    </div>
    <div class="quiz-body">
      <div class="q-index" id="qIndex">Q1</div>
      <h2 class="q-title" id="qTitle"></h2>
      <div class="options" id="options"></div>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section id="screen-result" class="screen">
    <div class="res-head">
      <h1>去端你天生该吃的那碗饭<br>去闯你本就该走的那条路</h1>
      <p>天赋能力测试测评报告 · 职业深度版</p>
    </div>
    <div id="resultBody"></div>
    <div class="reset-wrap">
      <button class="btn-ghost" id="resetBtn">重新测试</button>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 基础数据
     ========================================================= */

  // 10 个维度（F 为身体-动觉，即题面中未列出的第 6 项）
  var DIMS = {
    A: { name: '语言' },
    B: { name: '逻辑-算数' },
    C: { name: '空间' },
    D: { name: '内省' },
    E: { name: '人际' },
    F: { name: '身体-动觉' },
    G: { name: '音乐' },
    H: { name: '自然' },
    I: { name: '创造' },
    J: { name: '美学' }
  };

  var TYPE_NAMES = {
    A: '语言表达型', B: '逻辑分析型', C: '空间构象型', D: '内省洞察型',
    E: '人际共情型', F: '身体动觉型', G: '音乐感知型', H: '自然探索型',
    I: '创意创想型', J: '美学审美型'
  };

  /* ---------------------------------------------------------
     12 道情境题。
     ★ 每个选项对象自带 dim 字段——无论显示顺序如何被打乱，
       该选项永远只给同一个维度加分，保证「相同选择 = 相同结果」。
     --------------------------------------------------------- */
  var QUESTIONS = [
    {
      q: '周末有一整天空闲，你最想怎么过？',
      options: [
        { t: '读一本书、写点东西', d: 'A' },
        { t: '戴上耳机听歌、摆弄乐器', d: 'G' },
        { t: '出门拍照、逛展、看设计', d: 'J' },
        { t: '去户外走走、看看植物和动物', d: 'H' }
      ]
    },
    {
      q: '团队合作时，你自然会承担的角色是？',
      options: [
        { t: '出点子、提新玩法', d: 'I' },
        { t: '把大家的想法整理成方案', d: 'A' },
        { t: '协调关系、让气氛不僵', d: 'E' },
        { t: '盯数据、算成本、找漏洞', d: 'B' }
      ]
    },
    {
      q: '朋友向你倾诉烦恼，你更可能——',
      options: [
        { t: '安静地听，先感受他的情绪', d: 'E' },
        { t: '帮他把事情的因果理清楚', d: 'B' },
        { t: '用一句话说到他心坎里', d: 'A' },
        { t: '带他出去走走、运动一下', d: 'F' }
      ]
    },
    {
      q: '走进一个陌生的空间，你第一注意到的是——',
      options: [
        { t: '光线、配色和整体质感', d: 'J' },
        { t: '布局和动线顺不顺', d: 'C' },
        { t: '里面的人在做什么、什么关系', d: 'E' },
        { t: '有没有奇怪的噪音、背景音乐', d: 'G' }
      ]
    },
    {
      q: '学一个新东西，对你最有效的方式是——',
      options: [
        { t: '先自己琢磨，总结出规律', d: 'D' },
        { t: '直接上手做，边做边调', d: 'F' },
        { t: '画成图或表，把结构摆出来', d: 'C' },
        { t: '找人聊，听别人怎么讲', d: 'E' }
      ]
    },
    {
      q: '你更能忍受哪一种工作？',
      options: [
        { t: '需要长期观察、照顾活的东西', d: 'H' },
        { t: '需要反复打磨细节、追求好看', d: 'J' },
        { t: '需要不断产出新点子', d: 'I' },
        { t: '需要长时间独处、跟自己对话', d: 'D' }
      ]
    },
    {
      q: '别人夸你，最让你开心的是——',
      options: [
        { t: '“你说得真清楚，我一下就懂了”', d: 'A' },
        { t: '“你做的这个真好看”', d: 'J' },
        { t: '“跟你在一起很舒服”', d: 'E' },
        { t: '“你想得跟别人不一样”', d: 'I' }
      ]

    }
    return a;
  }

  /* =========================================================
     8. 计算
     ========================================================= */
  function computeResult() {
    // 原始分：每个选项固定 +3 分给它的维度（确定性，与显示顺序无关）
    var raw = {};
    Object.keys(DIMS).forEach(function (k) { raw[k] = 0; });

    answers.forEach(function (optIdx, qi) {
      if (optIdx < 0) return;
      var opt = sessionQuestions[qi].options[optIdx];
      raw[opt.d] += 3;
    });

    var totalRaw = Object.keys(raw).reduce(function (a, k) { return a + raw[k]; }, 0);
    var maxRaw = Math.max.apply(null, Object.keys(raw).map(function (k) { return raw[k]; }));
    if (maxRaw <= 0) maxRaw = 1;

    // 20 分制
    var scores = {};
    Object.keys(DIMS).forEach(function (k) {
      scores[k] = Math.max(1, Math.min(20, Math.round(raw[k] / maxRaw * 20)));
    });

    // 排序（分数优先，原始分做平手判定，字母顺序兜底保证确定性）
    var order = Object.keys(DIMS).sort(function (a, b) {
      if (scores[b] !== scores[a]) return scores[b] - scores[a];
      if (raw[b] !== raw[a]) return raw[b] - raw[a];
      return a < b ? -1 : 1;
    });

    var top1 = order[0], top2 = order[1], top3 = order[2];
    var low3 = [order[9], order[8], order[7]]; // 最低的三个，从最低开始

    // 类型匹配度
    var matchPct = Math.round(raw[top1] / Math.max(totalRaw, 1) * 200);
    matchPct = Math.max(40, Math.min(96, matchPct));

    return {
      raw: raw,
      scores: scores,
      order: order,
      top1: top1, top2: top2, top3: top3,
      low3: low3,
      matchPct: matchPct
    };
  }

  /* =========================================================
     9. 渲染结果
     ========================================================= */
  function careerPct(career, scores) {
    // 该职业涉及的维度
    var dims = [];
    var map = {
      '语言': 'A', '逻辑-算数': 'B', '空间': 'C', '内省': 'D', '人际': 'E',
      '身体-动觉': 'F', '音乐': 'G', '自然': 'H', '创造': 'I', '美学': 'J'
    };
    career.p.split('+').forEach(function (seg) {
      var key = seg.trim();
      if (map[key]) dims.push(map[key]);
    });
    if (!dims.length) dims = ['A'];

    var avg = dims.reduce(function (s, d) { return s + scores[d] / 20; }, 0) / dims.length;
    return Math.max(72, Math.min(99, Math.round(70 + 30 * avg)));
  }

  function buildCareers(res) {
    var list = [];
    var seen = {};
    var dimsOrder = [res.top1, res.top2, res.top3];
    var quotas = [3, 2, 1];

    dimsOrder.forEach(function (dim, i) {
      var pool = CAREERS[dim] || [];
      var added = 0;
      for (var k = 0; k < pool.length && added < quotas[i]; k++) {
        var c = pool[k];
        if (seen[c.n]) continue;
        seen[c.n] = true;
        list.push(c);
        added++;
      }
    });

    // 兜底补足
    var allDims = res.order;
    for (var d = 0; d < allDims.length && list.length < 6; d++) {
      var p2 = CAREERS[allDims[d]] || [];
      for (var m = 0; m < p2.length && list.length < 6; m++) {
        if (seen[p2[m].n]) continue;
        seen[p2[m].n] = true;
        list.push(p2[m]);
      }
    }
    return list;
  }

    var d2 = DIMS[res.top2].name;
    var d3 = DIMS[res.top3].name;
    var l1 = DIMS[res.low3[0]].name;
    var l2 = DIMS[res.low3[1]].name;
    var l3 = DIMS[res.low3[2]].name;
    var info = DIM_INFO[res.top1];
    var minDim = res.low3[0];
    var careers = buildCareers(res);

    var html = '';

    /* ---------- 第 2 张：天赋类型 + 图谱 ---------- */
    html += '<div class="card">' +
      '<div class="card-label">天赋能力图谱 · 10 维度</div>' +
      '<div class="type-head">' +
        '<span class="type-name">' + TYPE_NAMES[res.top1] + '</span>' +
        '<span class="type-pct">' + res.matchPct + '%</span>' +
      '</div>' +
      '<p class="type-desc">你最具有 <b>' + d1 + '</b>天赋、<b>' + d2 + '</b>天赋、<b>' + d3 +
        '</b>天赋，而 <b>' + l1 + '</b>、<b>' + l2 + '</b>、<b>' + l3 + '</b> 天赋相对较弱。</p>' +
      '<div class="bars">';

    Object.keys(DIMS).forEach(function (k) {
      var w = Math.round(s[k] / 20 * 100);
      html += '<div class="bar-row">' +
        '<span class="bar-label">' + k + ' ' + DIMS[k].name + '</span>' +
        '<div class="bar-track"><div class="bar-fill' + (k === res.top1 ? ' hot' : '') +
          '" data-w="' + w + '"></div></div>' +
        '<span class="bar-val">' + s[k] + '</span>' +
        '</div>';
    });

    html += '</div></div>';

    /* ---------- 第 3 张：各项天赋详情 ---------- */
    html += '<div class="card">' +
      '<div class="card-label">各项天赋详情</div>' +
      '<div class="detail-list">';

    Object.keys(DIMS).forEach(function (k) {
      html += '<div class="detail-row">' +
        '<span class="detail-name">' + DIMS[k].name + '</span>' +
        '<span class="detail-score">' + s[k] + '</span>' +
        '<span class="detail-level ' + levelClass(s[k]) + '">' + levelText(s[k]) + '</span>' +
        '</div>';
    });

    html += '</div>' +
      '<div class="type-line">天赋类型：<b>' + TYPE_NAMES[res.top1] + '</b>（' + d1 + ' / ' + d2 + ' / ' + d3 + '）</div>' +
      '</div>';

    /* ---------- 第 4 张：核心优势组合 ---------- */
    html += '<div class="card">' +
      '<div class="card-label">核心优势</div>' +
      '<p class="lead">' + info.summary + '</p>' +
      '<div class="kv"><span>优势组合</span><b>' + d1 + ' + ' + d2 + ' + ' + d3 + '</b></div>' +
      '<div class="kv"><span>潜在挑战</span><b>相对薄弱的是' + l1 + '与' + l2 + '，建议通过团队协作与互补型伙伴来弥补。</b></div>' +
      '<div class="first-talent">' +
        '<div class="ft-label">第一天赋</div>' +
        '<div class="ft-name">' + d1 + '天赋 ' + s[res.top1] + '/20</div>' +
        '<div class="ft-level">' + levelText(s[res.top1]) + '</div>' +
      '</div>' +
      '</div>';

    /* ---------- 第 5 张：第一天赋解读 ---------- */
    html += '<div class="card">' +
      '<div class="card-label">' + d1 + '天赋解读</div>' +
      '<p class="lead">' + info.read + '</p>' +
      '<div class="sub-label">可能特征</div>' +
      '<ul class="tick">' + info.traits.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '<div class="sub-label">职场最佳应用</div>' +
      '<div class="chips">' + info.apps.map(function (t) { return '<span class="chip">' + t + '</span>'; }).join('') + '</div>' +
      '</div>';

    /* ---------- 第 6 张：协同 + 建议 + 相似的人 ---------- */
    var synergy = [
      '+' + d2 + '天赋' + synergyPhrase(res.top2),
      '+' + d3 + '天赋' + synergyPhrase(res.top3)
    ];

    html += '<div class="card">' +
      '<div class="card-label">与其他天赋协同</div>' +
      '<ul class="tick">' + synergy.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '<div class="sub-label">发挥建议</div>' +
      '<ul class="tick">' + info.tips.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +

      '<div class="sim-box">' +
        '<div class="sim-name">与你相似的人：<em>' + info.sim + '</em></div>' +
        '<p class="sim-text">' + info.simText + '</p>' +
      '</div>' +

      '<div class="grow">成长空间：<b>' + DIMS[minDim].name + '天赋 ' + s[minDim] + ' 分</b>，需要更多练习与刻意补强。</div>' +
      '</div>';

    /* ---------- 第 7 张：推荐方向（前 3） ---------- */
    html += '<div class="card">' +
      '<div class="card-label">职业发展指南 · 推荐方向</div>';

    careers.slice(0, 3).forEach(function (c) {
      html += '<div class="career">' +
        '<div class="career-head">' +
          '<span class="career-name">' + c.n + '</span>' +
          '<span class="career-pct">' + careerPct(c, s) + '%</span>' +
        '</div>' +
        '<span class="career-tag">' + c.p + '</span>' +
        '<p class="career-desc">' + c.d + '</p>' +
        '</div>';
    });

    html += '</div>';

    /* ---------- 第 8 张：更多方向 + 谨慎方向 + 职业心声 ---------- */
    html += '<div class="card">' +
      '<div class="card-label">更多可能方向</div>';

    careers.slice(3, 6).forEach(function (c) {
      html += '<div class="career">' +
        '<div class="career-head">' +
          '<span class="career-name">' + c.n + '</span>' +
          '<span class="career-pct">' + careerPct(c, s) + '%</span>' +
        '</div>' +
        '<span class="career-tag">' + c.p + '</span>' +
        '<p class="career-desc">' + c.d + '</p>' +
        '</div>';
    });

    html += '<div class="caution">' +
        '<div class="caution-title">建议谨慎方向</div>' +
        '<p>' + CAUTION[res.low3[0]] + '；以及' + CAUTION[res.low3[1]] + '。这些方向并非不能做，但需要额外投入更多时间补齐短板。</p>' +
      '</div>' +

      '<div class="voice">' +
        '<div class="voice-title">职业心声 · 你的倾向</div>' +
        '<p>“' + info.voice + '”</p>' +
      '</div>' +
      '</div>';

    /* ---------- 第 9 张：行动计划 ---------- */
    var shortItems = ACTIONS[res.top1].short.concat([ACTIONS[res.top2].short[0]]);
    var midItems = ACTIONS[res.top1].mid.concat([ACTIONS[res.top2].mid[0]]);
    var longItems = ACTIONS[res.top1].long.concat([ACTIONS[res.top3].long[0]]);

    html += '<div class="card">' +
      '<div class="card-label">行动计划 · 分阶段成长路径</div>' +

      '<div class="phase">' +
        '<div class="phase-title">短期（1–3 个月）</div>' +
        '<ul>' + shortItems.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '</div>' +

      '<div class="phase">' +
        '<div class="phase-title">中期（6–12 个月）</div>' +
        '<ul>' + midItems.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '</div>' +

      '<div class="phase">' +
        '<div class="phase-title">长期（持续）</div>' +
        '<ul>' + longItems.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '</div>' +

      '</div>';

    resultBody.innerHTML = html;

    // 条形图动画
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        resultBody.querySelectorAll('.bar-fill').forEach(function (el) {
          el.style.width = el.getAttribute('data-w') + '%';
        });
      });
    });
  }

  /* 协同短语 */
  function synergyPhrase(dim) {
    var map = {
      A: '让你的表达更有说服力和传播力',
      B: '让你的想法有结构和可验证性',
      C: '让抽象的想法变成看得见的形状',
      D: '让你的方向更清楚、不容易跑偏',
      E: '让你更容易被别人理解和接纳',
      F: '让表达落到具体的动作和手感上',
      G: '让你的表达自带节奏与情绪感染力',
      H: '让你的观察更细致、更贴近真实世界',
      I: '让你的方案有新角度、不落俗套',
      J: '让你的成品在质感上更高级'
    };
    return map[dim] || '与你形成互补';
  }

  function finish() {
    var res = computeResult();
    renderResult(res);
    setTimeout(function () {
      showScreen(screenResult);
    }, 260);
  }

  /* =========================================================
     10. 事件绑定
     ========================================================= */
  document.getElementById('startBtn').addEventListener('click', startQuiz);
  document.getElementById('resetBtn').addEventListener('click', function () {
    showScreen(screenCover);
  });

})();
</script>
</body>
</html>
