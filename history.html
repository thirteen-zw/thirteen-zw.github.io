    match:'他一辈子没做成什么大官，却把「人该怎么相处」这件事讲成了两千年的标准。周游列国，处处碰壁，仍然相信教育能改变人。你重视表达与秩序，愿意把道理讲清楚，哪怕听的人当下并不理解。你相信只要话说到位，总有人会慢慢明白。'

/* =========================================================
   工具函数
   ========================================================= */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function pearson(a, b){
  const n = a.length;
  const ma = a.reduce((s,x)=>s+x,0)/n;
  const mb = b.reduce((s,x)=>s+x,0)/n;
  let num=0, da=0, db=0;
  for(let i=0;i<n;i++){
    const x = a[i]-ma, y = b[i]-mb;
    num += x*y; da += x*x; db += y*y;
  }
  const den = Math.sqrt(da*db);
  if(den < 1e-6) return 0;
  return num/den;
}

/* =========================================================
   计分
   ========================================================= */
function calcScores(picks){
  const raw = {};
  DIMS.forEach(d => raw[d.key] = 0);

  picks.forEach((optIdx, qi)=>{
    const s = QUESTIONS[qi].opts[optIdx].s;
    for(const k in s) raw[k] += s[k];
  });

  // 每个维度的理论最高分
  const maxp = {};
  DIMS.forEach(d => maxp[d.key] = 0);
  QUESTIONS.forEach(q=>{
    const per = {};
    DIMS.forEach(d => per[d.key] = 0);
    q.opts.forEach(o=>{
      for(const k in o.s) per[k] = Math.max(per[k], o.s[k]);
    });
    DIMS.forEach(d => maxp[d.key] += per[d.key]);
  });

  const scores = {};
  DIMS.forEach(d=>{
    const m = maxp[d.key] || 1;
    const ratio = Math.min(1, raw[d.key] / m);
    scores[d.key] = Math.max(18, Math.min(99, Math.round(25 + ratio * 74)));
  });
  return scores;
}

/* =========================================================
   匹配
   ========================================================= */
function findMatch(scores){
  const userVec = DIMS.map(d => scores[d.key]);
  let best = null, bestCorr = -2;
  FIGURES.forEach(f=>{
    const fv = DIMS.map(d => f.v[d.key]);
    const c = pearson(userVec, fv);
    if(c > bestCorr){ bestCorr = c; best = f; }
  });
  const pct = Math.round(Math.max(86, Math.min(97, 90 + bestCorr * 7)));
  return { fig: best, pct, corr: bestCorr };
}

/* =========================================================
   文案生成
   ========================================================= */
function buildExplain(scores, fig){
  const sorted = DIMS.slice().sort((a,b)=> scores[b.key] - scores[a.key]);
  const d1 = sorted[0], d2 = sorted[1];
  const d3 = sorted[2];

  const head =
    `你的八维倾向里，<b>「${d1.name}」${scores[d1.key]} 分</b>、<b>「${d2.name}」${scores[d2.key]} 分</b>最突出，` +
    `「${d3.name}」${scores[d3.key]} 分紧随其后。这说明在那些必须做取舍的时刻，你的第一反应往往是${d1.name}，` +
    `第二步才用${d2.name}去收尾——你不是没有情绪，只是不让情绪替你做决定。`;

  return head + '<br><br>' + fig.match;
}

/* =========================================================
   结果渲染
   ========================================================= */
function buildResultHTML(fig, pct, scores){
  const lead = DIMS.reduce((a,b)=> scores[b.key] > scores[a.key] ? b : a);

  const barsHTML = DIMS.map(d=>{
    const v = scores[d.key];
    const isLead = d.key === lead.key;
    return `<div class="bar-row">
      <span class="bar-name${isLead?' lead':''}">${d.name}</span>
      <div class="bar-track"><i class="bar-fill${isLead?' lead':''}" data-w="${v}"></i></div>
      <span class="bar-val${isLead?' lead':''}">${v}</span>
    </div>`;
  }).join('');

  const tagsHTML = fig.tags.map(t=>`<span>${t}</span>`).join('');

  return `
    <div class="res-top">
      <p class="res-eyebrow">历 史 人 物 匹 配 结 果</p>
      <div class="res-score">${pct}<em>%</em></div>
      <div class="res-score-label">匹 配 度</div>
      <h2 class="res-name">${fig.name}</h2>
      <p class="res-role">${fig.era} · ${fig.role}</p>
      <div class="res-tags">${tagsHTML}</div>
    </div>

    <div class="card">
      <div class="card-label">主 导 维 度</div>
      <div class="lead-wrap">
        <span class="lead-dim">${lead.name}</span>
        <span class="lead-score">${scores[lead.key]} 分</span>
      </div>
      <div class="hr"></div>
      <div class="card-label">心 声</div>
      <blockquote class="voice">「${fig.voice}」</blockquote>
    </div>

    <div class="card">
      <div class="card-label">八 维 倾 向</div>
      <div class="bars">${barsHTML}</div>
    </div>

    <div class="card">
      <div class="card-label">为 什 么 是 T A</div>
      <p class="explain">${buildExplain(scores, fig)}</p>
    </div>

    <div class="disclaimer">
      相近的是部分选择方式，<br>
      不代表经历、能力或价值相同。
    </div>

    <button class="btn-ghost" id="restartBtn">重 新 测 一 次</button>
    <p class="foot-mark">历 史 人 格 测 试</p>
  `;
}

function animateBars(){
  const fills = document.querySelectorAll('.bar-fill');
  fills.forEach(el => { el.style.width = '0%'; });
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      fills.forEach(el => { el.style.width = el.dataset.w + '%'; });
    }, 80);
  });
}

/* =========================================================
   流程控制
   ========================================================= */
let current = 0;
let picks = [];
let locked = false;

function renderQuestion(){
  const q = QUESTIONS[current];
  const total = QUESTIONS.length;

  document.getElementById('qIndex').textContent = current + 1;
  document.getElementById('qTotal').textContent = total;
  document.getElementById('progressBar').style.width =
    ((current) / total * 100) + '%';

  const body = document.getElementById('qBody');
  body.innerHTML = `
    <h2 class="q-text">${q.q}</h2>
    <div class="opts" id="opts"></div>
  `;
  body.classList.remove('fade-in');
  void body.offsetWidth;
  body.classList.add('fade-in');

  const optsWrap = document.getElementById('opts');
  q.opts.forEach((o, i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML =
      `<span class="opt-idx">${String.fromCharCode(65 + i)}</span>` +
      `<span class="opt-text">${o.t}</span>`;
    btn.addEventListener('click', ()=> choose(i, btn));
    optsWrap.appendChild(btn);
  });
}

function choose(idx, btn){
  if(locked) return;
  locked = true;
  btn.classList.add('selected');
  picks[current] = idx;

  setTimeout(()=>{
    locked = false;
    current++;
    if(current >= QUESTIONS.length){
      finish();
    }else{
      renderQuestion();
    }
  }, 280);
}

function finish(){
  document.getElementById('progressBar').style.width = '100%';

  const scores = calcScores(picks);
  const { fig, pct } = findMatch(scores);

  const res = document.getElementById('screen-result');
  res.innerHTML = buildResultHTML(fig, pct, scores);

  show('screen-result');
  animateBars();

  const restart = document.getElementById('restartBtn');
  if(restart){
    restart.addEventListener('click', ()=>{
      current = 0; picks = []; locked = false;
      show('screen-cover');
    });
  }
}

function startQuiz(){
  current = 0;
  picks = [];
  locked = false;
  document.getElementById('progressBar').style.width = '0%';
  show('screen-quiz');
  renderQuestion();
}

document.getElementById('startBtn').addEventListener('click', startQuiz);

/* 防止 iOS 双击缩放 */
let lastTouch = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive:false });
